name: Stock Alert Scan

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 工作日 18:30 北京时间(UTC+8=10:30 UTC)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}  # ✅ 必须完全一致！
        run: python scan.py
